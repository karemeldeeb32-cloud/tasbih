<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTL columns test</title>
<style>
body { margin: 0; background: #222; font-family: serif; }
.book-stage { perspective: 1200px; margin: 10px; }
.book-page { position: relative; height: 300px; background: linear-gradient(180deg,#fbf4dd,#f3e9c8 70%,#ecdfb8); border-radius: 6px; overflow: hidden; }
.book-content { position: absolute; inset: 16px 18px 34px 18px; overflow: hidden; }
.book-flow {
  height: 100%;
  column-width: 100%;
  column-fill: auto;
  column-gap: 0;
  font-size: 1.55rem; line-height: 2.4; text-align: right; color: #2b2118;
  transition: transform .45s cubic-bezier(.45,0,.25,1);
}
.ayah-end { display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; height: 1.9em; border: 1.5px solid #a8842c; border-radius: 50%; color: #a8842c; font-size: .62em; margin: 0 .35em; vertical-align: middle; padding: 0 .2em; }
.bismillah { text-align: center; font-size: 1.6rem; color: #8a6d1f; margin: 4px 0 12px; line-height: 2; }
#info { color: #fff; text-align: center; font-size: 20px; margin: 8px; }
button { font-size: 20px; padding: 8px 20px; margin: 4px; }
</style></head>
<body>
<div class="book-stage"><div class="book-page"><div class="book-content"><div class="book-flow" id="flow"></div></div></div></div>
<div id="info"></div>
<div style="text-align:center"><button id="prev">السابق ›</button><button id="next">‹ التالي</button></div>
<script>
const B="بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";
const ayahs=[
"الٓمٓ","ذَٰلِكَ ٱلْكِتَٰبُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ","ٱلَّذِينَ يُؤْمِنُونَ بِٱلْغَيْبِ وَيُقِيمُونَ ٱلصَّلَوٰةَ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَ","وَٱلَّذِينَ يُؤْمِنُونَ بِمَآ أُنزِلَ إِلَيْكَ وَمَآ أُنزِلَ مِن قَبْلِكَ وَبِٱلْءَاخِرَةِ هُمْ يُوقِنُونَ","أُو۟لَٰٓئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ ۖ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ","إِنَّ ٱلَّذِينَ كَفَرُوا۟ سَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ","خَتَمَ ٱللَّهُ عَلَىٰ قُلُوبِهِمْ وَعَلَىٰ سَمْعِهِمْ ۖ وَعَلَىٰٓ أَبْصَٰرِهِمْ غِشَٰوَةٌۭ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌۭ","وَمِنَ ٱلنَّاسِ مَن يَقُولُ ءَامَنَّا بِٱللَّهِ وَبِٱلْيَوْمِ ٱلْءَاخِرِ وَمَا هُم بِمُؤْمِنِينَ","يُخَٰدِعُونَ ٱللَّهَ وَٱلَّذِينَ ءَامَنُوا۟ وَمَا يَخْدَعُونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَ","فِى قُلُوبِهِم مَّرَضٌۭ فَزَادَهُمُ ٱللَّهُ مَرَضًۭا ۖ وَلَهُمْ عَذَابٌ أَلِيمٌۢ بِمَا كَانُوا۟ يَكْذِبُونَ",
"وَإِذَا قِيلَ لَهُمْ لَا تُفْسِدُوا۟ فِى ٱلْأَرْضِ قَالُوٓا۟ إِنَّمَا نَحْنُ مُصْلِحُونَ","أَلَآ إِنَّهُمْ هُمُ ٱلْمُفْسِدُونَ وَلَٰكِن لَّا يَشْعُرُونَ","وَإِذَا قِيلَ لَهُمْ ءَامِنُوا۟ كَمَآ ءَامَنَ ٱلنَّاسُ قَالُوٓا۟ أَنُؤْمِنُ كَمَآ ءَامَنَ ٱلسُّفَهَآءُ ۗ أَلَآ إِنَّهُمْ هُمُ ٱلسُّفَهَآءُ وَلَٰكِن لَّا يَعْلَمُونَ","وَإِذَا لَقُوا۟ ٱلَّذِينَ ءَامَنُوا۟ قَالُوٓا۟ ءَامَنَّا وَإِذَا خَلَوْا۟ إِلَىٰ شَيَٰطِينِهِمْ قَالُوٓا۟ إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِءُونَ","ٱللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِى طُغْيَٰنِهِمْ يَعْمَهُونَ","أُو۟لَٰٓئِكَ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلضَّلَٰلَةَ بِٱلْهُدَىٰ فَمَا رَبِحَت تِّجَٰرَتُهُمْ وَمَا كَانُوا۟ مُهْتَدِينَ"
];
let html='<div class="bismillah">'+B+'</div>';
ayahs.forEach((t,i)=>{ html+='<span class="ayah">'+t+' <span class="ayah-end">'+(i+1)+'</span></span> '; });
const flow=document.getElementById("flow");
flow.innerHTML=html;
const content=flow.parentElement;
let page=0;
function pages(){ return Math.max(1, Math.round(flow.scrollWidth / content.clientWidth)); }
function show(){
  flow.style.transform="translateX("+(page*100)+"%)";
  document.getElementById("info").textContent="page "+(page+1)+" of "+pages()+" | scrollWidth="+flow.scrollWidth+" clientWidth="+content.clientWidth;
}
document.getElementById("next").onclick=()=>{ if(page<pages()-1){page++; show();} };
document.getElementById("prev").onclick=()=>{ if(page>0){page--; show();} };
window.addEventListener("load",()=>setTimeout(show,300));
setTimeout(show,500);
</script>
</body></html>
